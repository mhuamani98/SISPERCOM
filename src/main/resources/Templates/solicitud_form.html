<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Licencias | Registro Profesional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .step-header { background: #f8f9fa; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; border-left: 5px solid #0d6efd; color: #0d6efd; }
        .card { border: none; border-radius: 15px; }
        .form-label { font-weight: 600; color: #495057; }
        .input-group-text { background-color: #f8f9fa; }
        /* Estilo para los radio buttons de riesgo */
        .btn-check:checked + .btn-outline-success { background-color: #198754; color: white; }
        .btn-check:checked + .btn-outline-warning { background-color: #ffc107; color: black; }
        .btn-check:checked + .btn-outline-danger { background-color: #dc3545; color: white; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4"><i class="bi bi-file-earmark-medical me-2"></i>Registro de Solicitud de Licencia</h2>
                    
                    <div th:if="${solicitud.observaciones != null}" class="alert alert-danger border-start border-4 border-danger shadow-sm mb-4">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-exclamation-octagon-fill fs-4 me-3"></i>
                            <div>
                                <h6 class="fw-bold mb-0">Observación del Evaluador:</h6>
                                <p class="mb-0" th:text="${solicitud.observaciones}"></p>
                            </div>
                        </div>
                    </div>
                    
                    <form th:action="@{/solicitud/guardar}" th:object="${solicitud}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">
                        
                        <div class="step-header"><i class="bi bi-shop me-2"></i>1. Detalles del Local y Negocio</div>
                        
                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label class="form-label">Nombre Comercial / Razón Social</label>
                                <input type="text" class="form-control" th:field="*{nombreNegocio}" placeholder="Ej. Inversiones El Sabor S.A.C." required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">RUC (11 dígitos)</label>
                                <input type="text" class="form-control" th:field="*{ruc}" maxlength="11" pattern="\d{11}" placeholder="20123456789" required>
                            </div>

                            <div class="col-md-9">
                                <label class="form-label">Dirección Exacta del Establecimiento</label>
                                <input type="text" class="form-control" th:field="*{direccion}" placeholder="Av. Principal 123, Urb. Primavera" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Piso / Nivel</label>
                                <input type="number" class="form-control" th:field="*{piso}" placeholder="1" min="1">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Área Total (m2)</label>
                                <div class="input-group">
                                    <input type="number" step="0.01" class="form-control" th:field="*{areaM2}" required>
                                    <span class="input-group-text">m²</span>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Aforo Máximo</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" th:field="*{aforo}" required>
                                    <span class="input-group-text"><i class="bi bi-people"></i></span>
                                </div>
                            </div>
                            
                            <div class="col-md-4 text-center">
                                <label class="form-label d-block text-center">Nivel de Riesgo ITSE</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" th:field="*{riesgo}" value="BAJO" id="riesgoBajo" required>
                                    <label class="btn btn-outline-success" for="riesgoBajo">Bajo</label>

                                    <input type="radio" class="btn-check" th:field="*{riesgo}" value="MEDIO" id="riesgoMedio">
                                    <label class="btn btn-outline-warning" for="riesgoMedio">Medio</label>

                                    <input type="radio" class="btn-check" th:field="*{riesgo}" value="ALTO" id="riesgoAlto">
                                    <label class="btn btn-outline-danger" for="riesgoAlto">Alto</label>
                                </div>
                            </div>

                            <div class="col-md-12 mt-3">
                                <label class="form-label">Giro del Negocio (Actividad Principal)</label>
                                <select class="form-select shadow-sm" th:field="*{giro}" required>
                                    <option value="" selected>-- Seleccione una actividad económica oficial --</option>
                                    <optgroup label="COMERCIO MINORISTA">
                                        <option value="VENTA AL POR MENOR EN BODEGAS / MINIMARKET">Bodega / Minimarket / Tienda de conveniencia</option>
                                        <option value="VENTA DE PRODUCTOS FARMACÉUTICOS">Farmacia / Botica / Perfumería</option>
                                        <option value="VENTA DE ARTÍCULOS DE FERRETERÍA">Ferretería y materiales de construcción</option>
                                        <option value="VENTA DE PRENDAS DE VESTIR Y CALZADO">Tienda de ropa, calzado y accesorios</option>
                                    </optgroup>
                                    <optgroup label="SERVICIOS PROFESIONALES Y SALUD">
                                        <option value="OFICINAS DE ADMINISTRACIÓN PÚBLICA O PRIVADA">Oficinas administrativas y contables</option>
                                        <option value="ACTIVIDADES DE PELUQUERÍA Y TRATAMIENTO DE BELLEZA">Peluquería / Barbería / Spa</option>
                                        <option value="ACTIVIDADES DE PRÁCTICA MÉDICA Y ODONTOLÓGICA">Consultorio Médico / Policlínico / Dental</option>
                                        <option value="CENTROS DE ENSEÑANZA Y CAPACITACIÓN">Institución Educativa / Nido / Academia</option>
                                    </optgroup>
                                    <optgroup label="RESTAURANTES Y ENTRETENIMIENTO">
                                        <option value="RESTAURANTES Y SERVICIOS DE COMIDA MÓVIL">Restaurante / Cafetería / Pizzería</option>
                                        <option value="SERVICIOS DE PREPARACIÓN DE BEBIDAS">Bar / Discoteca / Pub (Requiere Riesgo Alto)</option>
                                        <option value="ELABORACIÓN DE PRODUCTOS DE PANADERÍA">Panadería / Pastelería / Catering</option>
                                    </optgroup>
                                </select>
                            </div>
                        </div>

                        <div class="step-header"><i class="bi bi-cloud-arrow-up me-2"></i>2. Carga de Documentación (PDF)</div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label small text-muted">📄 Certificado ITSE</label>
                                <input type="file" name="fileItse" class="form-control" accept=".pdf">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">🏠 Título/Contrato</label>
                                <input type="file" name="fileContrato" class="form-control" accept=".pdf">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">💰 Voucher de Pago</label>
                                <input type="file" name="fileVoucher" class="form-control" accept=".pdf">
                            </div>
                        </div>

                        <div class="alert alert-info py-2 small">
                            <i class="bi bi-info-circle-fill me-2"></i> La información proporcionada tiene carácter de <strong>Declaración Jurada</strong>.
                        </div>

                        <div class="d-flex justify-content-between pt-3">
                            <a th:href="@{/usuario/home}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-arrow-left me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm">
                                Registrar Solicitud <i class="bi bi-check2-all ms-2"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="${showModal}">
    window.onload = function() {
        var myModal = new bootstrap.Modal(document.getElementById('graciasModal'));
        myModal.show();
    };
</script>
</body>
</html>
