# ============================================================
# CONFIGURACION GENERAL
# ============================================================
spring.application.name=Semana03
server.port=7777
spring.thymeleaf.cache=false

# ============================================================
# CONEXI\u00d3N A MYSQL (Aseg\u00farate que tu clave sea 1234)
# ============================================================
# Configuraci\u00f3n de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/semana03_db
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci\u00f3n de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Eliminamos el dialect manual para que Spring Boot lo detecte solo (m\u00e1s seguro)
spring.jpa.open-in-view=false
server.port=7777

# ============================================================
# LOGS PARA DEBUG (Aqu\u00ed veremos por qu\u00e9 no arranca)
# ============================================================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================
# MULTIPART
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Ruta donde se guardar\u00e1n los archivos (relativa a la carpeta del proyecto)
upload.path=uploads/

