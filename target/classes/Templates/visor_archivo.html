<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Visor de Documentos | ITSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; }
        .pdf-container { height: calc(100vh - 60px); width: 100%; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Visualizando: <strong th:text="${tipoArchivo}">TIPO</strong> (Solicitud #<span th:text="${idSolicitud}">0</span>)</span>
        <button onclick="window.close()" class="btn btn-outline-light btn-sm">Cerrar Ventana</button>
    </nav>
    
    <div class="pdf-container">
        <iframe src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" 
                width="100%" height="100%" style="border: none;">
        </iframe>
    </div>
</body>
</html>
