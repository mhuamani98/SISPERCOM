<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bandeja del Abogado | ITSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .badge-status { min-width: 100px; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold"><i class="bi bi-shield-check"></i> Panel del Abogado</span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white p-3">
                <h5 class="mb-0">Solicitudes para Emisión de Certificado</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Negocio</th>
                                <th>Documentos</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="solicitud : ${solicitudes}">
                                <td class="fw-bold" th:text="${solicitud.nombreNegocio}"></td>
                                
                                <td>
                                    <a th:if="${solicitud.archivoItse}" 
                                       th:href="@{'/uploads/' + ${solicitud.archivoItse}}" 
                                       target="_blank" class="btn btn-link btn-sm p-0">
                                        <i class="bi bi-file-earmark-pdf"></i> Ver ITSE
                                    </a>
                                </td>

                                <td>
                                    <span th:text="${solicitud.estado}" 
                                          class="badge badge-status"
                                          th:classappend="${solicitud.estado == 'EMITIDO' ? 'bg-success' : 
                                                           solicitud.estado == 'RECHAZADO' ? 'bg-danger' : 'bg-warning text-dark'}">
                                    </span>
                                </td>

                                <td>
                                    <form th:if="${solicitud.estado != 'EMITIDO'}" 
                                    th:action="@{/solicitud/emitir-certificado}" method="post" enctype="multipart/form-data" 
                                    class="row g-2 align-items-center">
    
                                    <input type="hidden" name="id" th:value="${solicitud.id}">
    
                                    <div class="col-auto">
                                    <input type="file" name="fileCertificado" class="form-control form-control-sm" accept="image/*" required>
                                    </div>
    
                                    <div class="col-auto">
                                    <button type="submit" class="btn btn-sm btn-dark">Emitir Certificado</button>
                                    </div>
                                    </form>
                                    
                                   <a th:if="${solicitud.estado == 'EMITIDO'}" 
                                    th:href="@{/solicitud/ver-certificado/{id}(id=${solicitud.id})}" 
                                    target="_blank" class="btn btn-sm btn-primary">
                                    <i class="bi bi-printer"></i> Ver Certificado
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(solicitudes)}">
                                <td colspan="4" class="text-center py-4 text-muted">No hay solicitudes pendientes.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
