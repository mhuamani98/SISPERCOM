<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Trámite - ITSE Los Olivos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .badge { min-width: 90px; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-building me-2"></i>SISTEMA ITSE</a>
            <div class="ms-auto">
                <a th:href="@{/solicitud/form}" class="btn btn-success me-2">
                    <i class="bi bi-plus-circle me-1"></i> Nueva Solicitud
                </a>
                <a th:href="@{/logout}" class="btn btn-outline-danger">
    <i class="bi bi-box-arrow-right me-1"></i> Salir
</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom">
                <h5 class="mb-0 text-primary fw-bold">
                    <i class="bi bi-list-check me-2"></i>Estado de mis Trámites
                </h5>
            </div>
            <div class="card-body">

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Establecimiento</th>
                                <th>RUC</th>
                                <th class="text-center">Estado</th>
                                <th>Observaciones</th>
                                <th class="text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${solicitudes}">
                                <td th:text="${s.nombreNegocio}" class="fw-bold"></td>
                                <td th:text="${s.ruc}" class="text-muted"></td>
                                <td class="text-center">
                                    <span th:text="${s.estado}" 
                                          class="badge"
                                          th:classappend="${s.estado == 'PENDIENTE' ? 'bg-warning text-dark' : 
                                                           s.estado == 'APROBADO' ? 'bg-info text-dark' : 
                                                           s.estado == 'EMITIDO' ? 'bg-success' : 
                                                           s.estado == 'RECHAZADO' ? 'bg-danger' : 'bg-secondary'}">
                                    </span>
                                </td>
                                
                                <td>
                                    <div th:if="${not #strings.isEmpty(s.observaciones)}" class="alert alert-warning p-1 mb-0 small">
                                        <i class="bi bi-exclamation-triangle me-1"></i> 
                                        <span th:text="${s.observaciones}"></span>
                                    </div>
                                    <span th:if="${#strings.isEmpty(s.observaciones)}" class="text-muted small italic">
                                        Sin observaciones
                                    </span>
                                </td>
                                <td class="text-center">
    <a th:if="${s.estado == 'EMITIDO'}" 
   th:href="@{/solicitud/ver-certificado/{id}(id=${s.id})}" 
   class="btn btn-primary btn-sm shadow-sm" target="_blank">
    <i class="bi bi-file-earmark-check-fill me-1"></i> Ver Certificado
</a>
    
    <a th:if="${s.estado == 'EN REVISION'}" 
       th:href="@{/solicitud/editar/{id}(id=${s.id})}" 
       class="btn btn-warning btn-sm shadow-sm">
        <i class="bi bi-pencil-square me-1"></i> Corregir
    </a>
    
    <span th:if="${s.estado != 'EMITIDO' && s.estado != 'EN REVISION' && s.estado != 'RECHAZADO'}" class="text-muted small">
    <i class="bi bi-clock-history"></i> En proceso
</span>
</td>
                            </tr>
                            
                            <tr th:if="${#lists.isEmpty(solicitudes)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="bi bi-folder-x display-4 d-block mb-2"></i>
                                    Aún no has registrado ninguna solicitud.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:if="${showModal}">
    Swal.fire({
        title: '¡Enviado con éxito!',
        text: 'Tu solicitud ya está en nuestras manos. ¡Te avisaremos pronto!',
        icon: 'success',
        background: '#ffffff',
        borderRadius: '20px', // Bordes redondeados más modernos
        showConfirmButton: true,
        confirmButtonText: 'Genial, gracias',
        confirmButtonColor: '#0d6efd', // Azul institucional
        buttonsStyling: true,
        showClass: {
            popup: 'animate__animated animate__backInDown' // Animación de entrada con rebote
        },
        hideClass: {
            popup: 'animate__animated animate__fadeOutDown' // Salida elegante hacia abajo
        },
        // Añadimos un diseño más limpio a la tipografía y sombras
        customClass: {
            title: 'fs-3 fw-bold text-dark',
            popup: 'shadow-lg border-0',
            confirmButton: 'btn btn-primary btn-lg px-5 rounded-pill' // Botón redondeado tipo "píldora"
        }
    });
</script>
</body>
</html>
