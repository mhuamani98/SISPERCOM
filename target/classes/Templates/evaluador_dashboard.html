<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Evaluador ITSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Panel de Evaluación</h2>
        <table class="table table-striped mt-3">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Negocio</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${solicitudes}">
                    <td th:text="${s.id}"></td>
                    <td th:text="${s.nombreNegocio}"></td>
                    <td><span class="badge bg-primary" th:text="${s.estado}"></span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
